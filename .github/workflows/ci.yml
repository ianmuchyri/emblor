name: CI
on:
  push:
    branches:
      - '**'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          check-latest: true
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Check prettier format
        run: npm run prettier-check

      - name: Build packages
        run: npm run build
